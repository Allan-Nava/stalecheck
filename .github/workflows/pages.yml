name: Pages

# The page is generated from README.md, so it rebuilds when the README, the manifest,
# the measured runs or the generator move — and on nothing else.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - package.json
      - site/**
      - evals/results/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # `marked` is a dev dependency used by the generator alone; the published
      # package stays dependency-free, which the guards job in ci.yml enforces.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build:site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
